<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>문의하기 | ToolMate</title>
  <meta name="description" content="ToolMate 서비스 이용 관련 피드백, 기능 제안 및 제휴 문의 페이지입니다.">
  <link rel="stylesheet" href="shared/design-system.css">
  <style>
    .contact-wrap { max-width: 680px; margin: 40px auto; }
    .contact-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-lg); padding: 32px; box-shadow: 0 4px 20px rgba(0,0,0,0.05); }
    .contact-card h1 { font-size: 1.6rem; font-weight: 800; color: var(--text-main); margin-bottom: 8px; }
    .contact-card p { font-size: 0.95rem; color: var(--text-muted); margin-bottom: 24px; }
    .form-group { margin-bottom: 16px; }
    .form-group label { display: block; font-size: 0.88rem; font-weight: 700; color: var(--text-main); margin-bottom: 6px; }
    .form-control { width: 100%; padding: 12px 14px; border: 1.5px solid var(--border); border-radius: var(--radius-md); background: var(--surface-alt); color: var(--text-main); font-size: 0.95rem; outline: none; }
    .form-control:focus { border-color: var(--primary); background: var(--surface); }
    textarea.form-control { resize: vertical; min-height: 120px; }
    .btn-submit { width: 100%; padding: 14px; background: var(--primary); color: #fff; border: none; border-radius: var(--radius-md); font-size: 1rem; font-weight: 700; cursor: pointer; transition: opacity 0.2s; }
    .btn-submit:hover { opacity: 0.9; }
    .direct-email { margin-top: 24px; padding-top: 20px; border-top: 1px solid var(--border); text-align: center; font-size: 0.9rem; color: var(--text-muted); }
  </style>
  <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-8342530091491582" crossorigin="anonymous"></script>
</head>
<body>

  <header class="gnb">
    <div class="gnb-inner">
      <a href="index.html" class="gnb-brand">
        <span class="logo-badge">⚡</span>
        <span>ToolMate</span>
      </a>
      <div class="gnb-nav">
        <div class="dropdown" id="allToolsDropdown">
          <button class="dropdown-toggle" onclick="toggleDropdown()">전체 도구 ▾</button>
          <div class="dropdown-menu" id="dropdownMenu"></div>
        </div>
        <button id="themeToggleBtn" class="theme-toggle-btn" title="테마 전환">🌙</button>
      </div>
    </div>
  </header>

  <main class="container">
    <div class="contact-wrap">
      <div class="contact-card">
        <h1>📬 문의하기 (Contact Us)</h1>
        <p>새로운 도구 제안, 버그 제보, 광고 및 제휴 문의를 언제든 남겨주세요.</p>

        <form onsubmit="handleSubmit(event)">
          <div class="form-group">
            <label>이름 / 닉네임</label>
            <input type="text" class="form-control" placeholder="홍길동" required>
          </div>
          <div class="form-group">
            <label>답변받으실 이메일 주소</label>
            <input type="email" class="form-control" placeholder="example@email.com" required>
          </div>
          <div class="form-group">
            <label>문의 유형</label>
            <select class="form-control">
              <option>도구 기능 개선 / 버그 제보</option>
              <option>새로운 도구 제작 요청</option>
              <option>광고 및 제휴 제안</option>
              <option>기타 문의</option>
            </select>
          </div>
          <div class="form-group">
            <label>문의 내용</label>
            <textarea class="form-control" placeholder="구체적인 내용을 작성해 주세요." required></textarea>
          </div>
          <button type="submit" class="btn-submit">문의 메일 보내기</button>
        </form>

        <div class="direct-email">
          직접 이메일 문의: <strong>support@toolmate.kr</strong>
        </div>
      </div>
    </div>
  </main>

  <footer class="site-footer">
    <div class="footer-inner">
      <div style="display:flex; gap:16px; justify-content:center; margin-bottom:12px; font-size:0.85rem;">
        <a href="about.html" style="color:var(--text-muted);">사이트 소개</a>
        <a href="privacy.html" style="color:var(--text-muted);">개인정보처리방침</a>
        <a href="terms.html" style="color:var(--text-muted);">이용약관</a>
        <a href="contact.html" style="color:var(--primary); font-weight:700;">문의하기</a>
      </div>
      <p>© 2026 ToolMate. All processing done client-side in browser.</p>
    </div>
  </footer>

  <script src="shared/common.js"></script>
  <script>
    function handleSubmit(e) {
      e.preventDefault();
      alert('문의가 성공적으로 접수되었습니다. 확인 후 기재해주신 이메일로 답변드리겠습니다.');
      e.target.reset();
    }
  </script>
</body>
</html>
