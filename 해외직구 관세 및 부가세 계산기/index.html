<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>해외직구 관세 & 부가세 계산기 2026 | ToolMate</title>
  <meta name="description" content="미국, 유럽, 일본, 중국 알리/테무 직구 시 면세 한도와 품목별 관부가세를 계산합니다.">
  <meta name="keywords" content="해외직구관세,직구부가세,관세계산기,직구면세한도,알리관세">
  <link rel="canonical" href="https://toolmate.kr/해외직구 관세 및 부가세 계산기/index.html">
  <link rel="stylesheet" href="../shared/design-system.css">
  <style>
    .calc-wrap { max-width: 760px; margin: 0 auto; }
    .result-hero { background: linear-gradient(135deg, #0284c7 0%, #0369a1 100%); color:#fff; border-radius: var(--radius-lg); padding: 24px; text-align:center; margin-top:20px; }
  </style>
</head>
<body>
  <header class="gnb">
    <div class="gnb-inner">
      <a href="../index.html" class="gnb-brand"><span class="logo-badge">⚡</span><span>ToolMate</span></a>
      <div class="gnb-nav">
        <div class="dropdown" id="allToolsDropdown"><button class="dropdown-toggle" onclick="toggleDropdown()">전체 도구 ▾</button><div class="dropdown-menu" id="dropdownMenu"></div></div>
        <button id="themeToggleBtn" class="theme-toggle-btn" title="테마 전환">🌙</button>
      </div>
    </div>
  </header>
  <main class="container">
    <div class="calc-wrap">
      <div class="page-header">
        <span class="pill-badge">✈️ 관세청 2026 기준 적용</span>
        <h1 class="page-title">해외직구 관세 & 부가세 계산기</h1>
        <p class="page-desc">국가별 면세 한도(미국 , 기타 )와 품목별 관세율을 반영하여 총 예상 납부 세액을 계산합니다.</p>
      </div>
      <div class="card card-padded">
        <div class="form-group">
          <label class="form-label">구입 국가</label>
          <select id="country" class="select-field" onchange="calcDuty()">
            <option value="us">미국 (목록통관  이하 면세)</option>
            <option value="other">중국, 일본, 유럽 등 기타 ( 이하 면세)</option>
          </select>
        </div>
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;">
          <div class="form-group">
            <label class="form-label">물품 구매 금액 (USD)</label>
            <input type="number" id="itemPrice" class="input-field" value="250" step="10" oninput="calcDuty()">
          </div>
          <div class="form-group">
            <label class="form-label">품목 선택</label>
            <select id="category" class="select-field" onchange="calcDuty()">
              <option value="0.08">일반 의류 / 패션잡화 (관세 13% + 부가세 10%)</option>
              <option value="0.00">전자기기 / 스마트폰 (관세 0% + 부가세 10%)</option>
              <option value="0.065">화장품 / 향수 (관세 6.5% + 부가세 10%)</option>
              <option value="0.08">건강기능식품 / 영양제 (관세 8% + 부가세 10%)</option>
            </select>
          </div>
        </div>
        <div class="result-hero">
          <div style="font-size:0.88rem;opacity:0.85;">예상 총 납부 세액 (관세 + 부가세)</div>
          <div style="font-size:3rem;font-weight:900;font-family:var(--font-mono);color:#38bdf8;margin:6px 0;" id="totalTax">0원</div>
          <div style="font-size:0.95rem;opacity:0.9;" id="taxDetail">과세 대상입니다.</div>
        </div>
      </div>
    </div>
  </main>
  <footer class="site-footer"><div class="footer-inner"><p>© 2026 ToolMate.</p></div></footer>
  <script src="../shared/common.js"></script>
  <script>
    function calcDuty() {
      const country = document.getElementById('country').value;
      const price = parseFloat(document.getElementById('itemPrice').value) || 0;
      const tariffRate = parseFloat(document.getElementById('category').value);
      const exRate = 1380;
      const limit = country === 'us' ? 200 : 150;
      if (price <= limit) {
        document.getElementById('totalTax').textContent = '0원 (면세 통관)';
        document.getElementById('taxDetail').textContent = 면세 기준(\{limit}) 이하로 관세와 부가세가 전액 면제됩니다!;
        return;
      }
      const totalKrw = price * exRate;
      const duty = totalKrw * tariffRate;
      const vat = (totalKrw + duty) * 0.10;
      const total = Math.floor(duty + vat);
      document.getElementById('totalTax').textContent = total.toLocaleString() + '원';
      document.getElementById('taxDetail').textContent = 관세 약 원 + 부가세 약 원;
    }
    calcDuty();
  </script>
</body>
</html>
