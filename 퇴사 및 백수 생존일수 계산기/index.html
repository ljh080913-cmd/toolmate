<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>퇴사 후 백수 생존일수 계산기 2026 | ToolMate</title>
  <meta name="description" content="통장 잔고, 퇴직금, 실업급여, 월 고정지출을 입력하면 수입 없이 버틸 수 있는 생존 일수를 계산합니다.">
  <meta name="keywords" content="퇴사계산기,백수생존일수,통장잔고생존,퇴사후생존">
  <link rel="canonical" href="https://toolmate.kr/퇴사 및 백수 생존일수 계산기/index.html">
  <link rel="stylesheet" href="../shared/design-system.css">
  <style>
    .calc-wrap { max-width: 720px; margin: 0 auto; }
    .result-hero { background: linear-gradient(135deg, #0f172a 0%, #334155 100%); color:#fff; border-radius: var(--radius-lg); padding: 24px; text-align:center; margin-top:20px; }
  </style>
</head>
<body>
  <header class="gnb">
    <div class="gnb-inner">
      <a href="../index.html" class="gnb-brand"><span class="logo-badge">⚡</span><span>ToolMate</span></a>
      <div class="gnb-nav">
        <div class="dropdown" id="allToolsDropdown"><button class="dropdown-toggle" onclick="toggleDropdown()">전체 도구 ▾</button><div class="dropdown-menu" id="dropdownMenu"></div></div>
        <button id="themeToggleBtn" class="theme-toggle-btn" title="테마 전환">🌙</button>
      </div>
    </div>
  </header>
  <main class="container">
    <div class="calc-wrap">
      <div class="page-header">
        <span class="pill-badge">💼 퇴사 준비 필수 계산기</span>
        <h1 class="page-title">퇴사 후 백수 생존일수 계산기</h1>
        <p class="page-desc">보유 자산과 매월 나가는 생활비를 비교하여 다음 직장을 구할 때까지 버틸 수 있는 총 생존 일수와 개월 수를 계산합니다.</p>
      </div>
      <div class="card card-padded">
        <div class="form-group">
          <label class="form-label">보유 총 자산 (통장 잔고 + 퇴직금 + 비상금)</label>
          <input type="number" id="totalAsset" class="input-field" value="15000000" step="100000" oninput="calcSurvive()">
        </div>
        <div class="form-group">
          <label class="form-label">월 고정 생활비 (월세, 식비, 공과금, 보험료 등)</label>
          <input type="number" id="monthlyExpense" class="input-field" value="1500000" step="50000" oninput="calcSurvive()">
        </div>
        <div class="result-hero">
          <div style="font-size:0.88rem;opacity:0.85;">버틸 수 있는 총 생존 기간</div>
          <div style="font-size:3.2rem;font-weight:900;font-family:var(--font-mono);color:#38bdf8;margin:6px 0;" id="surviveDays">약 300일</div>
          <div style="font-size:1.1rem;font-weight:700;" id="surviveMonths">약 10.0개월 동안 안전하게 생존 가능</div>
        </div>
      </div>
    </div>
  </main>
  <footer class="site-footer"><div class="footer-inner"><p>© 2026 ToolMate.</p></div></footer>
  <script src="../shared/common.js"></script>
  <script>
    function calcSurvive() {
      const asset = parseFloat(document.getElementById('totalAsset').value) || 0;
      const expense = parseFloat(document.getElementById('monthlyExpense').value) || 1;
      const months = asset / expense;
      const days = Math.floor(months * 30.4);
      document.getElementById('surviveDays').textContent = 약 일;
      document.getElementById('surviveMonths').textContent = 약 개월 동안 안전하게 생존 가능;
    }
    calcSurvive();
  </script>
</body>
</html>
