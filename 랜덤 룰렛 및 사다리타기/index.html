  <script>
    const COLORS = ['#ef4444', '#f59e0b', '#10b981', '#3b82f6', '#8b5cf6', '#ec4899', '#14b8a6', '#6366f1'];
    let currentRotation = 0, isSpinning = false;
    function getItems() { return document.getElementById('itemsInput').value.split(/[,\n]+/).map(s => s.trim()).filter(Boolean); }
    function drawWheel() {
      const items = getItems();
      const canvas = document.getElementById('wheelCanvas');
      const ctx = canvas.getContext('2d');
      if (items.length === 0) return;
      const arc = (2 * Math.PI) / items.length;
      ctx.clearRect(0, 0, 500, 500);
      items.forEach((item, i) => {
        const angle = i * arc;
        ctx.beginPath(); ctx.fillStyle = COLORS[i % COLORS.length]; ctx.moveTo(250, 250); ctx.arc(250, 250, 240, angle, angle + arc); ctx.fill(); ctx.stroke();
        ctx.save(); ctx.translate(250, 250); ctx.rotate(angle + arc / 2); ctx.fillStyle = '#ffffff'; ctx.font = 'bold 22px Pretendard, sans-serif'; ctx.textAlign = 'right'; ctx.fillText(item, 210, 8); ctx.restore();
      });
    }
    function spinWheel() {
      if (isSpinning) return;
      const items = getItems();
      if (items.length < 2) { alert('최소 2개 이상의 항목을 적어주세요!'); return; }

      document.getElementById('winnerBanner').style.display = 'none';
